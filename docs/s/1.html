document.querySelectorAll('.galwrap').forEach(w=>{const g=w.querySelector('.gal'),pg=w.querySelector('.pg'),
pv=w.querySelector('.arr.prev'),nx=w.querySelector('.arr.next'),n=g.children.length,
cur=()=>Math.round(g.scrollLeft/g.clientWidth);
const upd=()=>{const i=cur();pg.textContent=(i+1)+' / '+n;pv.disabled=i<=0;nx.disabled=i>=n-1};
w.go=d=>g.scrollTo({left:(cur()+d)*g.clientWidth,behavior:'smooth'});
pv.onclick=()=>w.go(-1);nx.onclick=()=>w.go(1);g.addEventListener('scroll',upd,{passive:true});upd()});

document.querySelectorAll('.share').forEach(b=>b.onclick=async()=>{const d={title:b.dataset.title,
text:b.dataset.text,url:b.dataset.url};
if(navigator.share){try{await navigator.share(d)}catch(e){}return}
try{await navigator.clipboard.writeText(d.url)}catch(e){const t=document.createElement('textarea');t.value=d.url;
document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}
let m=document.getElementById('toast');if(!m){m=document.createElement('div');m.id='toast';document.body.appendChild(m)}
m.textContent='링크를 복사했어요. 카톡·인스타에 붙여 넣으세요';m.classList.add('on');setTimeout(()=>m.classList.remove('on'),2200)});

const w1=document.querySelector('.galwrap');
document.addEventListener('keydown',e=>{if(!w1)return;if(e.key==='ArrowLeft')w1.go(-1);if(e.key==='ArrowRight')w1.go(1)});
