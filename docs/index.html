<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>숨은숙소</title><style>
:root{--bg:#f6f1e8;--card:#fff;--ink:#22261d;--sub:#6b6f63;--olive:#343a2c;--sand:#ece2d0}
@media (prefers-color-scheme:dark){:root{--bg:#171a14;--card:#22261d;--ink:#ece2d0;--sub:#a9ad9f;--olive:#ece2d0;--sand:#343a2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
header{padding:28px 16px 8px;text-align:center}header b{font-size:22px}header p{margin:6px 0 0;color:var(--sub);font-size:14px}
main{max-width:520px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--card);border-radius:16px;overflow:hidden;margin:14px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.body{padding:14px 16px 16px}.no{font-size:13px;color:var(--sub)}.name{font-size:19px;font-weight:700;margin:2px 0}
.region{font-size:14px;color:var(--sub);margin-bottom:12px}
.btn{display:block;text-align:center;padding:14px;border-radius:12px;background:var(--olive);color:var(--bg);font-weight:700;text-decoration:none;margin-top:8px}
.btn.alt{background:var(--sand);color:var(--ink)}
footer{max-width:520px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--sub);line-height:1.5}
</style></head><body><header><b>숨은숙소</b><p>유명해지기 전에 가는 국내 숙소</p></header><main><p style="text-align:center">곧 숙소가 올라와요</p></main><footer>이 페이지의 링크는 제휴 링크로, 예약 시 숨은숙소가 일정액의 수수료를 받을 수 있습니다.</footer></body></html>
