// 전체 목록(list.json)은 뒤에서 받아 검색·필터·정렬·쪽 이동 때 쓴다. 화면에는 지금 쪽 10곳만 그린다.
const q=document.getElementById('q'),cnt=document.getElementById('cnt'),emp=document.getElementById('emp'),
rg=document.getElementById('rg'),th=document.getElementById('th'),more=document.getElementById('more'),
box=document.getElementById('cards'),sb=document.getElementById('sortp'),si=document.getElementById('sorti');
const PAGE=10;let pg=1,sortMode=0,ALL=null;
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
// 메인 맨 위 = 지금 계절 숙소 중 하나를 접속할 때마다 무작위로(계절판 점수 7 이상, 없으면 5 이상)
const pick=INIT.sea.length?INIT.sea[Math.floor(Math.random()*INIT.sea.length)]:null;
const order=list=>pick?[pick,...list.filter(d=>d.n!==pick.n)]:list;
let load=null;const getAll=()=>load=load||fetch('list.json?v='+INIT.ver).then(r=>r.json()).then(a=>{ALL=a;return a});
function card(d,k){const tags=d.t.map(t=>'<span class="tag">'+E(t)+'</span>').join(''),
imgs=Array.from({length:d.i},(_,j)=>'<img src="'+d.u+p2(j+1)+'.webp?v='+d.v+'" alt="'+E(d.m)+' 사진 '+(j+1)+'" width="720" height="900" decoding="async" loading="'+(j===0&&k<2?'eager':'lazy')+'"'+(j===0&&k===0?' fetchpriority="high"':'')+'>').join('');
return '<div class="card" data-no="'+d.n+'"><div class="galwrap"><div class="gal">'+imgs+'</div>'+
'<button class="arr prev" aria-label="이전 사진">‹</button><button class="arr next" aria-label="다음 사진">›</button><div class="pg"></div></div>'+
'<div class="chead"><div class="crow"><a class="name" href="s/'+d.n+'">'+E(d.m)+'</a>'+(d.p?'<div class="price">'+E(d.p)+'</div>':'')+'</div>'+
'<div class="region">'+E(d.r)+'</div></div><div class="cardfoot">'+
(d.b?'<a class="btn book" href="'+E(d.b[0])+'" rel="sponsored nofollow noopener">'+E(d.b[1])+'</a>':'')+
'<button class="share" aria-label="공유하기" data-url="'+INIT.site+'/s/'+d.n+'" data-title="'+E(d.m)+' — 숨은숙소" data-text="'+E(d.r+' · '+d.h.slice(0,2).join(' · '))+'" data-image="'+d.u+'share.jpg?v='+d.v+'">'+INIT.icon+'</button></div>'+
'<div class="cmore"><p class="disc" style="margin-top:6px">'+INIT.disc+'</p><div class="badges" style="margin-top:10px"><span class="no">'+p2(d.n)+'번</span>'+tags+'</div>'+
'<ul class="hl">'+d.h.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul></div></div>'}
// 번호로도 찾게: '94', '94번', '094', '#94' 다 걸리도록(10-30)
const text=d=>d._t=d._t||['#'+d.n+'#',d.n+'번',p2(d.n)+'번',String(d.n).padStart(3,'0'),d.m,d.r,d.g,...d.t,...d.h].join(' ').toLowerCase();
const price=d=>d.pn>0?d.pn:null;
function filtered(list){const t=q.value.trim().toLowerCase(),region=rg.value,theme=th.value,
nq=t.replace(/[#번\s]/g,''),numQ=/^\d+$/.test(nq)?String(+nq):'';
let out=order(list).filter(d=>(!region||d.g===region)&&(!theme||d.t.includes(theme))&&(!t||(numQ?text(d).includes('#'+numQ+'#'):text(d).includes(t))));
if(sortMode){out=out.map((d,i)=>[d,i]).sort((a,b)=>{const x=price(a[0]),y=price(b[0]);if(x===null&&y===null)return a[1]-b[1];
if(x===null)return 1;if(y===null)return -1;return sortMode===1?x-y:y-x}).map(a=>a[0])}
rg.classList.toggle('on',!!region);th.classList.toggle('on',!!theme);return out}
function draw(list,n){box.innerHTML=list.map(card).join('');box.querySelectorAll('.galwrap').forEach(gal);
cnt.textContent=n+'곳';emp.style.display=n?'none':'';
const last=Math.max(1,Math.ceil(n/PAGE));let h='';
if(last>1){const b=(i,l,on,dis)=>'<button data-p="'+i+'"'+(on?' class="on"':'')+(dis?' disabled':'')+'>'+l+'</button>';
h+=b(pg-1,'‹',0,pg===1);const a=Math.max(1,Math.min(pg-2,last-4)),z=Math.min(last,a+4);
for(let i=a;i<=z;i++)h+=b(i,i,i===pg,0);h+=b(pg+1,'›',0,pg===last)}
more.innerHTML=h;more.style.display=h?'':'none'}
let seq=0;
async function apply(keep){if(!keep)pg=1;const my=++seq;
const plain=!q.value.trim()&&!rg.value&&!th.value&&!sortMode&&pg===1;
if(plain&&!ALL){draw(order(INIT.list).slice(0,PAGE),INIT.total);return}  // 전체 목록을 받기 전에도 첫 쪽은 바로
const all=ALL||await getAll();if(my!==seq)return;const f=filtered(all);
draw(f.slice((pg-1)*PAGE,pg*PAGE),f.length)}
sb.onclick=()=>{sortMode=(sortMode+1)%3;si.textContent=['↕','↑','↓'][sortMode];sb.classList.toggle('on',sortMode>0);apply()};
more.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;pg=+b.dataset.p;apply(true);
document.querySelector('.bar').scrollIntoView({behavior:'smooth'})};
rg.onchange=()=>apply();th.onchange=()=>apply();q.oninput=()=>apply();
const p=new URLSearchParams(location.search);if(p.get('q')){q.value=p.get('q')}apply();
// 첫 화면을 그린 뒤 한가할 때 전체 목록을 미리 받아 둔다 — 검색·쪽 이동이 바로 되게
(window.requestIdleCallback||setTimeout)(()=>getAll().catch(()=>{load=null}),{timeout:2500});

(()=>{const box=document.getElementById('shs');if(!box)return;const $=id=>document.getElementById(id);
let cur={},last=null;const say=t=>{$('shs-msg').textContent=t};
function open(b){const d=b.dataset;cur={url:d.url,title:d.title,text:d.text,image:d.image};last=b;
$('shs-title').textContent=cur.title;$('shs-native').hidden=!navigator.share;say('');box.hidden=false;kakao();
document.documentElement.classList.add('shs-lock')}
function close(){box.hidden=true;document.documentElement.classList.remove('shs-lock');last&&last.focus&&last.focus()}
async function copy(){try{await navigator.clipboard.writeText(cur.url);return true}catch(e){}
try{const t=document.createElement('textarea');t.value=cur.url;t.style.position='fixed';t.style.opacity='0';
document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}}
const pop=u=>window.open(u,'_blank','noopener,width=640,height=720'),E=encodeURIComponent;let kr=null;
function kakao(){if(!KAKAO_KEY)return Promise.resolve(false);kr=kr||new Promise(res=>{const s=document.createElement('script');
s.src='https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js';s.onload=()=>{try{if(!Kakao.isInitialized())Kakao.init(KAKAO_KEY);
res(true)}catch(e){res(false)}};s.onerror=()=>res(false);document.head.appendChild(s)});return kr}
const act={async kakao(){if(window.Kakao&&Kakao.isInitialized&&Kakao.isInitialized()||await kakao()){Kakao.Share.sendDefault({objectType:'feed',content:{title:cur.title,
description:cur.text,imageUrl:cur.image,link:{mobileWebUrl:cur.url,webUrl:cur.url}},
buttons:[{title:'숙소 보러 가기',link:{mobileWebUrl:cur.url,webUrl:cur.url}}]});return}
if(navigator.share){try{await navigator.share({title:cur.title,text:cur.text,url:cur.url})}catch(e){}return}
say((await copy())?'주소를 복사했어요. 카톡 대화창에 붙여 넣어 보내 주세요.':'주소를 복사하지 못했어요.')},
facebook(){pop('https://www.facebook.com/sharer/sharer.php?u='+E(cur.url))},
band(){pop('https://band.us/plugin/share?body='+E(cur.title+'\n'+cur.url)+'&route='+E(location.hostname))},
naver(){pop('https://share.naver.com/web/shareView?url='+E(cur.url)+'&title='+E(cur.title))},
x(){pop('https://twitter.com/intent/tweet?text='+E(cur.title)+'&url='+E(cur.url))},
async copy(){say((await copy())?'주소를 복사했어요. 원하는 곳에 붙여 넣으세요.':'주소를 복사하지 못했어요.')}};
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.share');
if(b){e.preventDefault();open(b);return}if(box.hidden)return;
if(e.target.closest('[data-shs-close]')){close();return}const ch=e.target.closest('[data-ch]');if(ch)act[ch.dataset.ch]()},true);
$('shs-native').onclick=async()=>{try{await navigator.share({title:cur.title,text:cur.text,url:cur.url});close()}catch(e){}};
document.addEventListener('keydown',e=>{if(!box.hidden&&e.key==='Escape')close()})})();
</script></body></html>
